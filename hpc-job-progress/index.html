<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors https://*.chatgpt.site">
  <title>HPC 作业进度</title>
  <style>
    :root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#18201d;background:#f5f7f6;letter-spacing:0}*{box-sizing:border-box}body{margin:0;padding:24px}.shell{max-width:980px;margin:auto}.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:18px}h1{font-size:24px;margin:0 0 5px}.muted{color:#64706b;font-size:13px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}.stat,.job{background:#fff;border:1px solid #dce2df;border-radius:8px}.stat{padding:14px}.number{font-size:25px;font-weight:700;margin-top:4px}.jobs{display:grid;gap:10px}.job{padding:15px}.top,.line,.metrics{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.name{font-size:16px;font-weight:700}.state{font-size:12px;font-weight:800}.RUNNING{color:#177245}.PENDING{color:#a65a00}.bar{height:8px;background:#e8ecea;margin:12px 0 8px}.fill{height:100%;background:#177245;transition:width .3s}.metrics{justify-content:flex-start;color:#46514c;font-size:13px;margin-top:10px}.metrics span{min-width:110px}.error{padding:16px;border:1px solid #e4b6b6;background:#fff4f4;color:#8e2424}@media(max-width:600px){body{padding:14px}.summary{grid-template-columns:1fr}.head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
<main class="shell"><header class="head"><div><h1>HPC 作业进度</h1><div class="muted" id="updated">正在读取最新状态</div></div><div class="muted">每 5 分钟采集</div></header><section class="summary" id="summary"></section><section class="jobs" id="jobs"></section></main>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>v==null?'—':Number(v).toFixed(5);
const when=v=>v?new Date(v).toLocaleString('zh-CN',{timeZone:'Asia/Tokyo',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
function render(data){const jobs=data.jobs||[],running=jobs.filter(j=>j.state==='RUNNING'),pending=jobs.filter(j=>j.state==='PENDING');document.getElementById('updated').textContent='更新于 '+new Date(data.updated_at).toLocaleString('zh-CN',{timeZone:'Asia/Tokyo'});document.getElementById('summary').innerHTML=`<div class="stat"><div class="muted">运行中</div><div class="number">${running.length}</div></div><div class="stat"><div class="muted">排队中</div><div class="number">${pending.length}</div></div><div class="stat"><div class="muted">总进度</div><div class="number">${running.reduce((a,j)=>a+(j.epoch||0),0)} / ${running.reduce((a,j)=>a+(j.total_epochs||0),0)}</div></div>`;document.getElementById('jobs').innerHTML=jobs.map(j=>{const pct=j.total_epochs?Math.min(100,100*j.epoch/j.total_epochs):0;return `<article class="job"><div class="top"><div><div class="name">${esc(j.name)}</div><div class="muted">${esc(j.id)} · ${esc(j.partition)}${j.node?' · '+esc(j.node):''}${j.gpu?' · '+esc(j.gpu):''}</div></div><div><div class="state ${esc(j.state)}">${esc(j.state)}</div><div class="muted">${j.state==='PENDING'?'预计开始 '+when(j.scheduled_start):'预计结束 '+when(j.eta)}</div></div></div><div class="line"><span>训练进度</span><strong>${j.epoch||0} / ${j.total_epochs||'—'}</strong></div><div class="bar"><div class="fill" style="width:${pct}%"></div></div><div class="metrics"><span>loss <b>${num(j.loss)}</b></span><span>评估 epoch <b>${j.eval_epoch??'—'}</b></span><span>recall <b>${num(j.recall)}</b></span><span>precision <b>${num(j.precision)}</b></span><span>chamfer <b>${num(j.chamfer)}</b></span></div></article>`}).join('')||'<div class="stat">当前没有作业</div>'}
async function load(){try{const r=await fetch('status.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);render(await r.json())}catch(e){document.getElementById('jobs').innerHTML='<div class="error">状态数据暂时不可用</div>'}}load();setInterval(load,60000);
</script>
</body>
</html>
